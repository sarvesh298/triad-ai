<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TRIAD AI – Document Management</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f46e5'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='17' font-weight='700' fill='white' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
  <script>
    // Apply the saved theme before first paint.
    (function () {
      var pref = "dark";
      try { pref = localStorage.getItem("dms_theme") || "dark"; } catch (e) {}
      var dark = pref === "dark" || (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <meta name="theme-color" content="#09090b">
</head>
<body>
  <div id="root"><div class="boot">Loading…</div></div>
  <div id="toasts" class="toasts" role="region" aria-live="polite" aria-label="Notifications"></div>
  <noscript>This application requires JavaScript.</noscript>
  <!-- ES modules: serve this folder over HTTP (VS Code Live Server or `python -m http.server 5500`). -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
